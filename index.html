<div id="root"></div>
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --ink: #2b2620;
    --muted: #8a8075;
    --line: #ece7de;
    --accent: #8a5cf6;
    --accent-soft: #f1ebfd;
    --claimed: #eef7ee;
    --claimed-line: #cfe8cf;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); margin: 0; }
  #root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1 {
    font-size: 20px;
    margin: 4px 0 2px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 18px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  .row.claimed {
    background: var(--claimed);
    border-color: var(--claimed-line);
  }
  .num {
    width: 24px;
    flex-shrink: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .deck-input {
    flex: 1.1;
    min-width: 0;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    padding: 6px 4px;
    border-radius: 6px;
  }
  .deck-input:hover, .deck-input:focus { background: #f4f1ec; outline: none; }
  .arrow { color: var(--muted); font-size: 13px; flex-shrink: 0; }
  .claim-input {
    flex: 1;
    min-width: 0;
    border: 1px dashed var(--line);
    background: transparent;
    font-size: 14px;
    color: var(--ink);
    padding: 6px 8px;
    border-radius: 6px;
  }
  .claim-input::placeholder { color: var(--muted); }
  .claim-input:hover, .claim-input:focus {
    border-style: solid;
    border-color: var(--accent);
    outline: none;
    background: var(--accent-soft);
  }
  .claim-input.filled {
    border-style: solid;
    border-color: var(--claimed-line);
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .count {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .status {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .status.show { opacity: 1; }
</style>

<!--
  ============================================================
  SETUP REQUIRED — do this once before hosting/sharing this page:
  1. Go to https://console.firebase.google.com, create a free project.
  2. In the project, go to "Build > Realtime Database" and click "Create Database"
     (choose any region, start in "test mode" for now).
  3. In Database > Rules, set:
       {
         "rules": {
           ".read": true,
           ".write": true
         }
       }
     This makes the list publicly readable/writable by anyone with the link —
     which is what you want for a no-login shared list, but it also means
     anyone with the page URL could technically edit or clear it. Don't put
     anything sensitive in it.
  4. Go to Project settings (gear icon) > General > "Your apps" > click the
     web icon (</>) to register a web app. Copy the firebaseConfig object
     it gives you and paste it below, replacing the placeholder.
  5. Host this HTML file somewhere public (GitHub Pages, Netlify, Vercel —
     all free) and share that URL. It no longer depends on Claude at all.
  ============================================================
-->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ---- PASTE YOUR FIREBASE CONFIG HERE (see setup instructions above) ----
const firebaseConfig = {
  apiKey: "AIzaSyDLZdJY1C9Iu3Gm95UsaQMtOy-UinuVMN0",
  authDomain: "booster-sharing-68cc4.firebaseapp.com",
  databaseURL: "https://booster-sharing-68cc4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "booster-sharing-68cc4",
  storageBucket: "booster-sharing-68cc4.firebasestorage.app",
  messagingSenderId: "226942843477",
  appId: "1:226942843477:web:bfd861a712e3b359df32dc"
};
// --------------------------------------------------------------------

const DECK_NAMES = [
  "Raz", "Varga", "Welstra", "Zorga", "Blandg", "Alq", "Paul", "Alden",
  "Lisia", "Liael Odium", "Levi", "Bavs", "Veiss", "Art", "Sephi",
  "Bheroes", "Berk", "Mag", "Draj", "Liael Drac", "Nana", "Prison",
  "Norn", "Krys", "Jheeva", "Greedon"
];
const DECK_COUNT = DECK_NAMES.length;

let dbRef = null;
let configOk = false;
try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref("deck-list-state");
    configOk = true;
  }
} catch (e) {
  configOk = false;
}

function App() {
  const [decks, setDecks] = useState(
    Array.from({ length: DECK_COUNT }, (_, i) => ({
      name: DECK_NAMES[i],
      claim: ""
    }))
  );
  const [loaded, setLoaded] = useState(false);
  const [statusMsg, setStatusMsg] = useState("");
  const saveTimers = useRef({});
  const isRemoteUpdate = useRef(false);

  useEffect(() => {
    if (!configOk) {
      setLoaded(true);
      return;
    }
    // Live sync: listen for changes from anyone, anytime.
    dbRef.on("value", (snapshot) => {
      const val = snapshot.val();
      if (Array.isArray(val) && val.length === DECK_COUNT) {
        isRemoteUpdate.current = true;
        setDecks(val);
      }
      setLoaded(true);
    }, (err) => {
      setLoaded(true);
      flashStatus("Can't connect — check Firebase rules");
    });
    return () => dbRef.off();
  }, []);

  const flashStatus = useCallback((msg) => {
    setStatusMsg(msg);
    clearTimeout(flashStatus._t);
    flashStatus._t = setTimeout(() => setStatusMsg(""), 1400);
  }, []);

  const persist = useCallback(async (nextDecks) => {
    if (!configOk) {
      flashStatus("No Firebase config set");
      return;
    }
    try {
      await dbRef.set(nextDecks);
      flashStatus("Saved");
    } catch (e) {
      flashStatus("Save failed — try again");
    }
  }, [flashStatus]);

  const updateDeck = (idx, field, value) => {
    setDecks((prev) => {
      const next = prev.slice();
      next[idx] = { ...next[idx], [field]: value };
      clearTimeout(saveTimers.current[idx]);
      saveTimers.current[idx] = setTimeout(() => persist(next), 400);
      return next;
    });
  };

  const claimedCount = decks.filter((d) => d.claim.trim() !== "").length;

  if (!loaded) {
    return <div style={{ padding: 24, color: "var(--muted)", fontSize: 14 }}>Loading list…</div>;
  }

  return (
    <div>
      <div className="top-bar">
        <h1>Deck Draft List</h1>
        <span className="count">{claimedCount}/{DECK_COUNT} claimed</span>
      </div>
      <div className="sub">
        {configOk
          ? "Shared with everyone who has this link — edit a deck name or claim it as yours. Changes sync live for everyone, no account needed."
          : "⚠️ Firebase isn't configured yet — edits here won't be saved or shared. See the setup comment at the top of this file's HTML."}
      </div>

      {decks.map((deck, idx) => (
        <div key={idx} className={`row ${deck.claim.trim() ? "claimed" : ""}`}>
          <span className="num">{idx + 1}</span>
          <input
            className="deck-input"
            value={deck.name}
            onChange={(e) => updateDeck(idx, "name", e.target.value)}
            placeholder={`Deck ${idx + 1}`}
          />
          <span className="arrow">→</span>
          <input
            className={`claim-input ${deck.claim.trim() ? "filled" : ""}`}
            value={deck.claim}
            onChange={(e) => updateDeck(idx, "claim", e.target.value)}
            placeholder="Who wants it?"
          />
        </div>
      ))}

      <div className={`status ${statusMsg ? "show" : ""}`}>{statusMsg}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
